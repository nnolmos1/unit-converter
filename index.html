<html>
    <head>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="index.css">
    </head>
    <body>

        <div id="container"> 
            <div id="input-container">
                <h1 class="heading">Metric/Imperial Unit Conversion</h1>
                <input id="input-value">
                <button id="convert-btn">Convert</button>
            </div>

            <div id="output-container">
                <div id="length-card">
                    <div class="card-content"> 
                        <h2 class="card-title">Length (Meter/Feet)</h2>
                        <p id="length-output">Enter a value to convert!</p>
                    </div>
                </div>
                <div id="volume-card">
                    <div class="card-content">
                        <h2 class="card-title">Volume (Liters/Gallons)</h2>
                        <p id="volume-output">Enter a value to convert!</p>
                    </div>
                </div>
                <div id="mass-card">
                    <div class="card-content">
                        <h2 class="card-title">Mass (Kilograms/Pounds)</h2>
                        <p id="mass-output">Enter a value to convert!</p>
                    </div>
                </div>
            </div>
        </div>

        <script src="index.js"></script>
    </body>
</html>
